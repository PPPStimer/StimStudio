name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      # PortAudio for sounddevice; GL / EGL, fonts and audio libraries for Qt (offscreen) and Qt Multimedia
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libasound2t64

      - name: Python packages
        run: python -m pip install -r requirements.txt "pytest>=9.1"

      # the GUI tests run on Qt's offscreen platform (set in tests/conftest.py)
      - name: Tests
        run: python -m pytest -q
